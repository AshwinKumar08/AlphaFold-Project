services:
    frontend:
        restart: unless-stopped
        build: docker
        container_name: af_frontend
        ports:
          - 5000:5000
        volumes:
          - ./app:/app/app:rw  #debug mood
          - ./tests:/app/tests:ro
          - ./data:/app/data:rw
          - ./logs:/app/logs:rw
          - ./results:/app/results:rw
        environment:
          DB_HOST: af_db
          DB_DATABASE: af-frontend
          DB_USER: frontend
          DB_PASSWORD: frontend-secret-password
          DB_PORT: 3306
        depends_on:
          db:
            condition: service_healthy
        links:
          - db

    db:
      image: mariadb:10
      restart: unless-stopped
      container_name: af_db
      environment:
          MARIADB_ROOT_PASSWORD: my-secret-root-password
          MARIADB_DATABASE: af-frontend
          MARIADB_USER: frontend
          MARIADB_PASSWORD: frontend-secret-password
          MARIADB_AUTO_UPGRADE: 1
      volumes:
          - ./db/initialTables.sql:/docker-entrypoint-initdb.d/initialTables.sql:ro
          - ./db/data:/var/lib/mysql
      healthcheck:
          test: ["CMD", "mysql", "-u", "frontend", "--password=frontend-secret-password", "af-frontend", "-B", "-e", "select * from af_users limit 1"]
          interval: 10s
          timeout: 3s
          retries: 12
          

    backend:
        restart: unless-stopped
        build: docker
        container_name: af_backend
        user: www-data
        command: python3 /app/fake.py
        # command: python3 -u /app/backend_with_ssh.py
        # command: python3 -u /app/backend_with_watcher.py
        volumes:
          - ./backend/fake.py:/app/fake.py:ro
          - ./backend/backend_with_ssh.py:/app/backend_with_ssh.py:ro
          - ./backend/backend_with_watcher.py:/app/backend_with_watcher.py:ro
          - ./results:/app/results:rw
          - ./jobs:/app/jobs:rw  # needed for both implementations... circumvents permissions conflicts
          #- ./docker_host_key:/ssh/id_ed25519:ro  # needed for backend_with_ssh.py
          - ./ssh:/ssh:ro
        environment:
          DB_HOST: af_db
          DB_DATABASE: af-frontend
          DB_USER: frontend
          DB_PASSWORD: frontend-secret-password
          DB_PORT: 3306
          HOST_IP: 172.17.0.1
          HOST_USER: nobody  # replace with your username if using SSH
        depends_on:
          - db
        links:
          - db
          - frontend

